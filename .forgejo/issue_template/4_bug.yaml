name: Bug
about: Something doesn't work and needs immediate attention.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for things that are broken **now**. A small adjustment that
        can wait belongs in an *Issue*.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging / test
        - Local development
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking - users cannot work
        - Severe - wrong data or results
        - Limited - workaround exists
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages and tracebacks.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, e.g. from `make docker-logs web`.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit of montrek and this extension.
      placeholder: "e.g. montrek v1.4.2, extension v0.3.1"
