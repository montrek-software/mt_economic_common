name: Infrastructure
about: A change to the environment rather than the program itself (CI, Docker, deployment, servers).
title: "[Infrastructure] "
labels: ["infrastructure"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CI / Forgejo workflows
        - Docker / docker-compose
        - Deployment / server
        - Database
        - Keycloak / authentication
        - SonarQube
        - Other
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Rollout and rollback
      description: Steps to apply the change, expected downtime, and how to undo it.
  - type: textarea
    id: config
    attributes:
      label: Configuration changes
      description: New or changed `.env` variables, Forgejo variables or secrets. Never paste secret values.
